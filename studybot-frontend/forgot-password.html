<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <script>
    (function () {
      const saved = localStorage.getItem("studybot-theme");
      const theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <title>Reset Password — StudyBot</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="topnav">
    <div class="topnav-left">
      <a href="landing.html" class="logo">StudyBot</a>
    </div>
    <div class="topnav-right">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle light/dark theme" aria-pressed="false">🌙</button>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="form-error hidden" id="resetError" role="alert"></div>
      <div class="form-success hidden" id="resetSuccess" role="status">
        Check your inbox — a reset link is on its way (mock, no email sent yet).
      </div>

      <form id="resetForm" novalidate>
        <div class="field-group">
          <label for="resetEmail">Email</label>
          <input
            type="email"
            id="resetEmail"
            name="email"
            placeholder="you@example.com"
            required
            aria-describedby="resetEmailError"
          />
          <span class="field-error" id="resetEmailError"></span>
        </div>

        <button type="submit" class="btn-primary full-width" id="resetSubmitBtn">Send Reset Link</button>
      </form>

      <p class="auth-switch">
        Remembered it? <a href="login.html">Back to Log In</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
