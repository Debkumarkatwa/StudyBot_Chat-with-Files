<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <!-- Set theme BEFORE stylesheets load, to avoid a flash of the wrong theme -->
  <script>
    (function () {
      const saved = localStorage.getItem("studybot-theme");
      const theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <title>Log In — StudyBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="topnav">
    <div class="topnav-left">
      <a href="landing.html" class="logo">StudyBot</a>
    </div>
    <div class="topnav-right">
      <button class="icon-btn tooltip-bottom" id="themeToggle" data-tooltip="Toggle theme" aria-label="Toggle light/dark theme" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to keep chatting with your documents.</p>

      <div class="form-error hidden" id="loginError" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="you@example.com"
            required
            aria-describedby="loginEmailError"
          />
          <span class="field-error" id="loginEmailError"></span>
        </div>

        <div class="field-group">
          <div class="label-row">
            <label for="loginPassword">Password</label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-field">
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="••••••••"
              required
              aria-describedby="loginPasswordError"
            />
            <button type="button" class="password-toggle" id="toggleLoginPassword" aria-label="Show password"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
          </div>
          <span class="field-error" id="loginPasswordError"></span>
        </div>

        <button type="submit" class="btn-primary full-width" id="loginSubmitBtn">Log In</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
