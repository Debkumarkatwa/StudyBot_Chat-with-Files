<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <!-- Set theme BEFORE stylesheets load, to avoid a flash of the wrong theme -->
  <script>
    (function () {
      const saved = localStorage.getItem("studybot-theme");
      const theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <title>Log In — StudyBot</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="topnav">
    <div class="topnav-left">
      <a href="landing.html" class="logo">StudyBot</a>
    </div>
    <div class="topnav-right">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle light/dark theme" aria-pressed="false">🌙</button>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to keep chatting with your documents.</p>

      <div class="form-error hidden" id="loginError" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="you@example.com"
            required
            aria-describedby="loginEmailError"
          />
          <span class="field-error" id="loginEmailError"></span>
        </div>

        <div class="field-group">
          <div class="label-row">
            <label for="loginPassword">Password</label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-field">
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="••••••••"
              required
              aria-describedby="loginPasswordError"
            />
            <button type="button" class="password-toggle" id="toggleLoginPassword" aria-label="Show password">👁</button>
          </div>
          <span class="field-error" id="loginPasswordError"></span>
        </div>

        <button type="submit" class="btn-primary full-width" id="loginSubmitBtn">Log In</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
