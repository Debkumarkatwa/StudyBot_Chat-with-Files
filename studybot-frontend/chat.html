<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <script>
    (function () {
      const saved = localStorage.getItem("studybot-theme");
      const theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <title>Chat — StudyBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body>

  <!-- ============ SLIDING APP SIDEBAR ============ -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="app-sidebar-header">
      <a href="landing.html" class="logo logo-link" aria-label="Go to home page">StudyBot</a>
      <button class="icon-btn tooltip-bottom" id="closeSidebar" data-tooltip="Close sidebar" aria-label="Close sidebar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </div>
    <nav class="app-sidebar-nav">
      <a href="chat.html" class="sidebar-link active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5.5h16a1 1 0 0 1 1 1V16a1 1 0 0 1-1 1H9l-4 3.5V17H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1z"/></svg> Chat</a>
      <a href="documents.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg> Documents</a>
      <a href="profile.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg> Profile</a>
      <a href="settings.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="1.6" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg> Settings</a>
    </nav>
    <div class="app-sidebar-footer">
      <button class="sidebar-link logout-link" id="sidebarLogoutBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H6a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 6 20h3"/><path d="M14 16l4-4-4-4"/><line x1="18" y1="12" x2="9" y2="12"/></svg> Logout</button>
    </div>
  </aside>

  <!-- ============ TOP NAVBAR ============ -->
  <header class="topnav">
    <div class="topnav-left">
      <button class="icon-btn tooltip-bottom" id="openSidebar" data-tooltip="Open sidebar" aria-label="Open sidebar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
      <a href="landing.html" class="logo logo-link" aria-label="Go to home page">StudyBot</a>
    </div>
    <div class="topnav-right">
      <button class="icon-btn tooltip-bottom" id="themeToggle" data-tooltip="Toggle theme" aria-label="Toggle light/dark theme" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <div class="profile-menu-wrapper">
        <button class="profile-icon-btn tooltip-bottom" id="profileIconBtn" data-tooltip="Profile menu" aria-label="Open profile menu"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg></button>
        <div class="profile-dropdown hidden" id="profileDropdown">
          <a href="profile.html">View Profile</a>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="chat-page">

    <!-- ============ EMPTY STATE (no documents uploaded) ============ -->
    <div class="empty-state hidden" id="emptyState">
      <span class="empty-state-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 6.5a1 1 0 0 1 1-1H10l2 2h7.5a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg></span>
      <h2>No documents yet</h2>
      <p>Upload your notes, PDFs, or slides to start chatting with them.</p>
      <a href="documents.html" class="btn-primary btn-lg">+ Add Document</a>
    </div>

    <!-- ============ CHAT CONTAINER ============ -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="message bot">
          <p>Hey! Ask me anything about your uploaded documents.</p>
        </div>
      </div>

      <form class="chat-input-bar" id="chatForm">
        <div class="input-bar-actions">
          <a href="documents.html" class="icon-action-btn tooltip-top" data-tooltip="Add Document" aria-label="Add Document"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
          <button type="button" class="icon-action-btn tooltip-top" id="docSelectorBtn" data-tooltip="Choose Documents" aria-label="Choose Documents"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg></button>
          <button type="button" class="icon-action-btn tooltip-top" id="hybridToggleBtn" data-tooltip="Hybrid Mode" aria-label="Toggle Hybrid Mode" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><line x1="3.5" y1="12" x2="20.5" y2="12"/><path d="M12 3.5c2.6 2.4 2.6 14.6 0 17"/><path d="M12 3.5c-2.6 2.4-2.6 14.6 0 17"/></svg></button>
        </div>

        <textarea
          id="chatInput"
          rows="1"
          placeholder="Ask something about your documents... (Shift+Enter for new line)"
        ></textarea>
        <button type="submit" class="btn-primary" id="sendBtn" aria-label="Send message">Send</button>
      </form>

      <!-- ============ DOCUMENT SELECTOR DROPDOWN ============ -->
      <div class="doc-selector-dropdown hidden" id="docSelectorDropdown">
        <div class="doc-selector-header">
          <span>Search in</span>
          <button type="button" class="doc-selector-close" id="docSelectorClose" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
        </div>
        <label class="doc-selector-option">
          <input type="checkbox" id="docSelectAll" checked />
          <span>All documents</span>
        </label>
        <div class="doc-selector-list" id="docSelectorList"></div>
      </div>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" integrity="sha384-odPBjvtXVM/5hOYIr3A1dB+flh0c3wAT3bSesIOqEGmyUA4JoKf/YTWy0XKOYAY7" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha384-cwS6YdhLI7XS60eoDiC+egV0qHp8zI+Cms46R0nbn8JrmoAzV9uFL60etMZhAnSu" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
